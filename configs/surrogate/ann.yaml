name: ANN_cm6
model: ann
data:
  path: data/Out_ML_cm6.csv        # header-less CSV, see data/README.md
  n_samples: 10000
  input_cols: [0, 5]          # [start, stop) column range
  output_cols: [6, 206]
  test_ratio: 0.2
  val_ratio: 0.1          # carved from the training block; used for early stopping
  shuffle: false
  scaler: minmax
model_params:
  dense_units: [256, 128, 64, 32]
  activation: tanh
  kernel_initializer: uniform
  batch_norm: true
  dropout_rate: 0.2
  dropout_after: [1]
training:
  epochs: 1000
  batch_size: 128
  learning_rate: 1.0e-4
  patience_es: 50
  patience_lr: 20
  lr_factor: 0.5
  min_lr: 1.0e-7
  mixed_precision: auto   # mixed_float16 only when a GPU is available
output_dir: results/surrogate/ann
seed: 42
