name: CNN_GRU_cm
model: cnn_gru
data:
  path: data/Out_ML_cm.csv        # header-less CSV, see data/README.md
  n_samples: 30000
  input_cols: [0, 10]          # [start, stop) column range
  output_cols: [10, 216]
  test_ratio: 0.2
  val_ratio: 0.1          # carved from the training block; used for early stopping
  shuffle: false
  scaler: minmax
model_params:
  conv_filters: [128, 64]
  conv_kernels: [3, 3]
  units: [128, 64]
  dense_units: [128, 64]
  dropout_rate: 0.25
training:
  epochs: 1000
  batch_size: 128
  learning_rate: 1.0e-3
  patience_es: 50
  patience_lr: 20
  lr_factor: 0.5
  min_lr: 1.0e-6
  mixed_precision: auto   # mixed_float16 only when a GPU is available
output_dir: results/surrogate/cnn_gru
seed: 42
